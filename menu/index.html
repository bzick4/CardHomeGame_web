
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1,
                   maximum-scale=1,
                   user-scalable=no,
                   viewport-fit=cover">

    <title>CardHomeGame — Меню</title>

    <!-- Telegram Mini Apps SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background: #1c1522;
        }

        body {
            font-family: Arial, sans-serif;
            color: #f4d49d;
        }

        .container {
            width: 100%;
            max-width: 520px;
            min-height: 100dvh;
            margin: 0 auto;

            padding: 30px 20px;
            padding-top: max(30px, env(safe-area-inset-top));
            padding-bottom: max(30px, env(safe-area-inset-bottom));

            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 22px;
        }

        .header {
            text-align: center;
        }

        .logo {
            font-size: 66px;
            margin-bottom: 12px;
            filter: drop-shadow(0 5px 15px #0008);
        }

        h1 {
            font-size: 34px;
            margin: 0 0 12px;
            color: #f4d49d;
            text-shadow: 0 3px 12px #0008;
        }

        .subtitle {
            color: #c5adba;
            font-size: 15px;
            line-height: 1.5;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .menu-button {
            width: 100%;
            min-height: 112px;

            display: flex;
            align-items: center;
            gap: 16px;

            border-radius: 18px;
            border: 2px solid;

            padding: 18px;
            text-align: left;

            cursor: pointer;
            color: #ffe0a5;

            transition: transform 0.15s,
                        filter 0.15s;
        }

        .menu-button:active {
            transform: scale(0.97);
            filter: brightness(1.2);
        }

        .play {
            background: linear-gradient(
                135deg,
                #66442f,
                #38252b
            );

            border-color: #b9905b;
        }

        .glossary {
            background: linear-gradient(
                135deg,
                #51365c,
                #2a203b
            );

            border-color: #9875a4;
        }

        .icon {
            width: 64px;
            height: 64px;
            flex-shrink: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 37px;

            border-radius: 14px;
            background: #ffffff13;
        }

        .content {
            flex: 1;
        }

        .name {
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .description {
            font-size: 13px;
            color: #ddc5b9;
            line-height: 1.4;
        }

        .arrow {
            font-size: 25px;
            color: #f4d49d;
        }

        .footer {
            text-align: center;
            color: #9f8b9f;
            font-size: 12px;
            margin-top: 10px;
        }

        @media (max-height: 570px) {
            .container {
                justify-content: flex-start;
            }

            .logo {
                font-size: 42px;
            }

            h1 {
                font-size: 27px;
            }

            .menu-button {
                min-height: 90px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header class="header">

            <div class="logo">🏰</div>

            <h1>CardHomeGame</h1>

            <div class="subtitle">
                Добро пожаловать<br>
                в загадочный особняк!
            </div>

        </header>

        <main class="menu">

            <!-- ИГРА -->
            <button
                class="menu-button play"
                type="button"
                onclick="OpenGame()">

                <div class="icon">🎮</div>

                <div class="content">
                    <div class="name">Играть</div>

                    <div class="description">
                        Открыть главную игру
                    </div>
                </div>

                <div class="arrow">❯</div>

            </button>

            <!-- ГЛОССАРИЙ -->
            <button
                class="menu-button glossary"
                type="button"
                onclick="OpenGlossary()">

                <div class="icon">📖</div>

                <div class="content">
                    <div class="name">Глоссарий</div>

                    <div class="description">
                        Комнаты и персонажи
                    </div>
                </div>

                <div class="arrow">❯</div>

            </button>

        </main>

        <footer class="footer">
            Выбери, куда отправиться
        </footer>

    </div>

    <script>
        // Telegram Mini Apps SDK
        const telegram = window.Telegram?.WebApp;

        // Ссылка на главное Mini App.
        const gameUrl =
            "https://t.me/cardhomegamebot?startapp";

        // Ссылка на энциклопедию.
        const glossaryUrl =
            "https://bzick4.github.io/CardHomeGame_web/glossary/";

        // Настройка окна Telegram.
        if (telegram) {
            telegram.ready();
            telegram.expand();

            telegram.setHeaderColor("#1c1522");
            telegram.setBackgroundColor("#1c1522");
        }

        // Открытие главной игры.
        function OpenGame() {

            if (telegram) {
                // Запускаем Main App через Telegram.
                telegram.openTelegramLink(gameUrl);
            } else {
                // Для обычного браузера.
                window.location.href = gameUrl;
            }
        }

        // Открытие глоссария.
        function OpenGlossary() {

            // Переходим внутри текущего окна.
            window.location.href = glossaryUrl;
        }
    </script>

</body>
</html>
